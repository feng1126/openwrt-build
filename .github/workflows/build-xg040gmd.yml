name: Build XG-040G-MD OpenWrt

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: "OpenWrt source branch"
        type: string
        required: false
        default: "main"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo docker system prune -af || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget ccache python3 python3-dev

      - name: Clone official OpenWrt source
        id: source
        shell: bash
        env:
          SOURCE_BRANCH: ${{ inputs.base_branch }}
        run: |
          source_branch="${SOURCE_BRANCH:-main}"
          git check-ref-format --branch "$source_branch"
          echo "branch=$source_branch" >> "$GITHUB_OUTPUT"
          echo "artifact_branch=${source_branch//\//-}" >> "$GITHUB_OUTPUT"
          mkdir -p build-logs
          git clone --branch "$source_branch" https://github.com/openwrt/openwrt.git openwrt
          {
            echo "Repository: https://github.com/openwrt/openwrt"
            echo "Branch: $source_branch"
            git -C openwrt log -1 --format='%H %s'
          } | tee build-logs/source.txt
          cd openwrt
          git log --oneline -5

      - name: Copy local custom packages
        run: |
          cd openwrt
          mkdir -p package/custom
          for pkg in default-settings autosamba automount; do
            mkdir -p "package/custom/$pkg"
            cp -a "../local_packages/$pkg/Makefile" "../local_packages/$pkg/files" "package/custom/$pkg/"
          done
          cp -a ../local_packages/luci-app-airoha-npu package/custom/luci-app-airoha-npu
          cp -a ../local_packages/luci-app-wechatpush package/custom/luci-app-wechatpush
          cp -a ../local_packages/wrtbwmon package/custom/wrtbwmon
          cp -a ../local_packages/luci-app-socat package/custom/luci-app-socat
          cp -a ../local_packages/luci-app-zerotier package/custom/luci-app-zerotier
          cp -a ../local_packages/luci-app-natmapt package/custom/luci-app-natmapt
          cp -a ../local_packages/natmapt package/custom/natmapt
          test ! -e package/custom/luci-app-socat/root/etc/config/socat
          test -s package/custom/luci-app-socat/root/etc/uci-defaults/luci-app-socat
          cp -a ../local_packages/openwrt-passwall/luci-app-passwall package/custom/luci-app-passwall
          cp -a ../local_packages/openwrt-passwall-packages/. package/custom/
          echo "===== local custom packages ====="
          find package/custom -maxdepth 2 -name Makefile | sort

      - name: Fetch Argon theme from upstream
        shell: bash
        run: |
          cd openwrt
          mkdir -p ../build-logs
          git clone --depth 1 --branch master \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/custom/luci-theme-argon
          git -C package/custom/luci-theme-argon log -1 --format='%H %s' \
            | tee ../build-logs/argon-source.txt

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Install Full Cone NAT support
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs
          python3 scripts/apply-fullcone.py openwrt 2>&1 | tee build-logs/fullcone-setup.log
          cp patches/fullcone/sources.json build-logs/fullcone-sources.json

      - name: Generate config
        shell: bash
        run: |
          cd openwrt
          mkdir -p ../build-logs
          cp ../configs/xg040gmd.config .config
          cp .config ../build-logs/config.seed
          set -o pipefail
          make defconfig 2>&1 | tee ../build-logs/defconfig.log
          python3 ../scripts/enable-all-ddns.py
          make defconfig 2>&1 | tee ../build-logs/defconfig-ddns.log
          python3 ../scripts/enable-all-ddns.py --check
          cp .config ../build-logs/config.ddns
          for symbol in \
            CONFIG_TARGET_airoha \
            CONFIG_TARGET_airoha_an7581 \
            CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi \
            CONFIG_PACKAGE_airoha-en7581-npu-firmware \
            CONFIG_PACKAGE_kmod-nft-offload \
            CONFIG_PACKAGE_kmod-nft-fullcone \
            CONFIG_PACKAGE_firewall4 \
            CONFIG_PACKAGE_nftables-json \
            CONFIG_PACKAGE_conntrack \
            CONFIG_PACKAGE_default-settings \
            CONFIG_PACKAGE_autosamba \
            CONFIG_PACKAGE_automount \
            CONFIG_PACKAGE_luci-app-airoha-npu \
            CONFIG_PACKAGE_luci \
            CONFIG_PACKAGE_luci-ssl \
            CONFIG_LUCI_LANG_zh_Hans \
            CONFIG_PACKAGE_luci-i18n-base-zh-cn \
            CONFIG_PACKAGE_luci-theme-argon \
            CONFIG_PACKAGE_luci-app-wechatpush \
            CONFIG_PACKAGE_luci-app-wechatpush_Enable_Traffic_Monitoring \
            CONFIG_PACKAGE_wrtbwmon \
            CONFIG_PACKAGE_luci-app-socat \
            CONFIG_PACKAGE_luci-app-zerotier \
            CONFIG_PACKAGE_luci-i18n-zerotier-zh-cn \
            CONFIG_PACKAGE_zerotier \
            CONFIG_PACKAGE_luci-i18n-socat-zh-cn \
            CONFIG_PACKAGE_socat \
            CONFIG_PACKAGE_natmapt \
            CONFIG_PACKAGE_luci-app-natmapt \
            CONFIG_PACKAGE_luci-i18n-natmapt-zh-cn \
            CONFIG_PACKAGE_luci-compat \
            CONFIG_PACKAGE_cloudflared \
            CONFIG_PACKAGE_luci-app-cloudflared \
            CONFIG_PACKAGE_luci-i18n-cloudflared-zh-cn \
            CONFIG_PACKAGE_luci-app-passwall \
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria \
            CONFIG_PACKAGE_ipt2socks \
            CONFIG_PACKAGE_chinadns-ng \
            CONFIG_PACKAGE_dns2socks \
            CONFIG_PACKAGE_v2ray-geoip \
            CONFIG_PACKAGE_v2ray-geosite \
            CONFIG_PACKAGE_hysteria; do
            if ! grep -qx "${symbol}=y" .config; then
              echo "::error::Required configuration missing: ${symbol}=y"
              exit 1
            fi
          done
          if grep -Eq '^CONFIG_PACKAGE_(sing-box|luci-app-passwall_INCLUDE_SingBox)=(y|m)$' .config; then
            echo "::error::sing-box must remain disabled in this firmware"
            exit 1
          fi
          if grep -Eq '^CONFIG_PACKAGE_(xray-core|xray-plugin|luci-app-passwall_INCLUDE_Xray|luci-app-passwall_INCLUDE_Xray_Plugin)=(y|m)$' .config; then
            echo "::error::Xray must remain disabled; use Hysteria and native SOCKS forwarding"
            exit 1
          fi
          if grep -Eq '^CONFIG_PACKAGE_(natmap|luci-app-natmap|luci-i18n-natmap-zh-cn)=(y|m)$' .config; then
            echo "::error::Original NATMap packages conflict with the enhanced NATMap packages"
            exit 1
          fi
          echo "===== target profile check ====="
          grep -E 'CONFIG_TARGET_airoha|CONFIG_TARGET.*xg|CONFIG_TARGET.*nokia|CONFIG_TARGET.*040' .config || true
          echo "===== luci/package check ====="
          grep -E 'CONFIG_PACKAGE_luci|CONFIG_PACKAGE_smartdns|CONFIG_PACKAGE_ttyd|CONFIG_PACKAGE_zerotier|CONFIG_PACKAGE_ddns|CONFIG_PACKAGE_bind|CONFIG_PACKAGE_resolveip|CONFIG_PACKAGE_ip-full|CONFIG_PACKAGE_jq|CONFIG_PACKAGE_jsonfilter|CONFIG_PACKAGE_mosquitto|CONFIG_PACKAGE_socat|CONFIG_PACKAGE_.*argon|CONFIG_PACKAGE_.*wechatpush|CONFIG_PACKAGE_.*passwall|CONFIG_PACKAGE_.*sing-box|CONFIG_PACKAGE_.*xray|CONFIG_PACKAGE_.*shadowsocks|CONFIG_PACKAGE_.*haproxy' .config || true

      - name: Install XG-040G-MD WAN defaults
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y' openwrt/.config
          grep -qx 'CONFIG_PACKAGE_odhcp6c=y' openwrt/.config
          sh -n files/etc/init.d/codex-proxy
          sh -n files/etc/uci-defaults/98-ddns-recovery
          bash -n local_packages/natmapt/files/ddns/Cloudflare-Origin
          mkdir -p openwrt/files
          cp -a files/. openwrt/files/
          sh -n files/etc/uci-defaults/99-zz-passwall-geodata
          sh -n files/etc/uci-defaults/99-zz-xg040gmd-wan
          install -Dm755 files/etc/uci-defaults/99-zz-xg040gmd-wan \
            openwrt/files/etc/uci-defaults/99-zz-xg040gmd-wan
          cmp files/etc/uci-defaults/99-zz-xg040gmd-wan \
            openwrt/files/etc/uci-defaults/99-zz-xg040gmd-wan

      - name: Download sources
        shell: bash
        run: |
          cd openwrt
          set -o pipefail
          make download -j"$(nproc)" V=s 2>&1 | tee ../build-logs/download.log

      - name: Verify Full Cone package patches
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt
          for pkg in libs/libnftnl network/utils/nftables network/config/firewall4 custom/fullconenat-nft; do
            make "package/$pkg/prepare" V=s 2>&1 | tee -a ../build-logs/fullcone-prepare.log
          done
          grep -R -q 'NFTNL_EXPR_FULLCONE' build_dir/target-*/libnftnl-*/include/libnftnl/expr.h
          grep -R -q 'NFT_NAT_FULLCONE' build_dir/target-*/nftables-*/include/statement.h
          grep -R -q 'nft_try_fullcone' build_dir/target-*/firewall4-*/root/usr/share/ucode/fw4.uc

      - name: Build firmware
        shell: bash
        run: |
          cd openwrt
          mkdir -p ../build-logs
          set -o pipefail
          {
            git log -1 --format='%H %s'
            ./scripts/feeds list -s
            df -h
            free -h
          } > ../build-logs/build-info.txt 2>&1
          if make -j"$(nproc)" V=s 2>&1 | tee ../build-logs/build.log; then
            exit 0
          fi
          echo "Parallel build failed; retrying with one job for clearer diagnostics."
          make -j1 V=s 2>&1 | tee ../build-logs/build-retry.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xg040gmd-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-logs/
            openwrt/logs/
            openwrt/.config
            openwrt/feeds.buildinfo
          include-hidden-files: true
          retention-days: 14

      - name: Collect firmware
        if: always()
        run: |
          mkdir -p artifact
          if [ -d openwrt/bin/targets ]; then
            cp -a openwrt/bin/targets artifact/targets
          fi
          if [ -f openwrt/.config ]; then
            cp openwrt/.config artifact/openwrt.config
          fi
          find artifact -maxdepth 5 -type f | sort

      - name: Upload firmware artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xg040gmd-openwrt-${{ steps.source.outputs.artifact_branch || 'unknown' }}
          path: artifact
          retention-days: 14

      - name: Publish firmware release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_BRANCH: ${{ steps.source.outputs.branch }}
          ARTIFACT_BRANCH: ${{ steps.source.outputs.artifact_branch }}
        run: |
          set -euo pipefail
          tag="openwrt-${ARTIFACT_BRANCH}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mapfile -d '' files < <(find artifact/targets -type f ! -path '*/packages/*' -print0 | sort -z)
          if ! printf '%s\n' "${files[@]}" | grep -Eq '\.(bin|itb|img|ubi|img\.gz)$'; then
            echo "::error::No firmware image found; refusing to publish release"
            exit 1
          fi
          files+=(artifact/openwrt.config)
          {
            echo "XG-040G-MD OpenWrt firmware"
            echo
            echo "Source branch: ${BUILD_BRANCH}"
            echo "Build: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            cat build-logs/source.txt
          } > release-notes.md
          gh api "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          gh release create "$tag" "${files[@]}" \
            --verify-tag \
            --title "XG-040G-MD OpenWrt ${BUILD_BRANCH} · ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            --notes-file release-notes.md --draft
          gh release edit "$tag" --draft=false --latest
